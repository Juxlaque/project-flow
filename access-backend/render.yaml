services:
  - type: web
    name: reboot-access-backend
    runtime: node
    # "free" s'endort après 15 min sans trafic. Passe à "starter" pour un
    # service toujours allumé (cf. README -> "Garder le backend allumé").
    plan: free
    region: frankfurt
    rootDir: access-backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./data
      # Les valeurs ci-dessous sont à saisir dans le dashboard Render.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ACCESS_ROLE_ID
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_REDIRECTS
        value: rebootlauncher://auth
      - key: MAX_DEVICES
        value: "2"
      - key: REQUIRE_DEVICE
        value: "false"
    # Persistance des bans / machines : un disque Render exige un plan payant.
    # Décommente (et retire DATA_DIR ci-dessus) si tu passes en starter.
    # disk:
    #   name: access-data
    #   mountPath: /var/data
    #   sizeGB: 1
